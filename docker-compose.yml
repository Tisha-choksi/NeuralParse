services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: neuralparse
      POSTGRES_USER: neuralparse
      POSTGRES_PASSWORD: neuralparse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neuralparse
      MINIO_ROOT_PASSWORD: neuralparse123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  minio_data:

